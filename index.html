<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domina | Simulados CPA ANBIMA 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
    <div class="topo-conteudo">
        <img src="img/logo.png" alt="Domina" class="logo">
        <span class="slogan">Mais de 350 questões</span>
    </div>
</header>

<main class="conteudo">

    <div id="tela-inicial">
        <div class="grade-simulados">
            <div class="card card-simulado">
                <h3>Nova CPA 2026</h3>
                <button class="btn-principal" onclick="iniciarSimulado()">Questões</button>
                <button onclick="iniciarProva()">Simulado</button>
            </div>
        </div>
    </div>

    <div id="escolha-modulo" class="card escolha escolha-modulo" style="display: none;">
        <p>📚 O que deseja estudar?</p>
        <button class="btn-principal" onclick="escolherModulo('todos')">🔀 Todos os módulos</button>
        <button onclick="escolherModulo(1)">Módulo 1: Sistema Financeiro Nacional</button>
        <button onclick="escolherModulo(2)">Módulo 2: Produtos e tributação</button>
        <button onclick="escolherModulo(3)">Módulo 3: Finanças pessoais e suitability</button>
        <button onclick="escolherModulo(4)">Módulo 4: ESG e inovação</button>
    </div>

    <div id="escolha-cronometro" class="card escolha" style="display: none;">
        <p>⏱ Deseja usar cronômetro?</p>
        <button class="btn-principal" onclick="escolherCronometro(true)">Sim</button>
        <button onclick="escolherCronometro(false)">Não</button>
    </div>

    <div id="cronometro" class="cronometro" style="display: none;">
        <span id="tempo">⏱ 00:00</span>
        <button id="btnPausar" onclick="alternarPausa()">⏸ Pausar</button>
    </div>

    <div id="quiz" class="card quiz-container" style="display: none;">
        <div id="contexto-area"></div>
        <div id="pergunta-area"></div>
    </div>

    <div id="resultado" class="card resultado" style="display: none;">
        <p id="placar"></p>
        <p id="media-tempo"></p>
        <div id="grafico-tempo"></div>
        <div class="resultado-botoes">
            <button onclick="irParaInicio()">🏠 Página inicial</button>
            <button class="btn-principal" onclick="voltarQuestoes()">↩ Voltar às questões</button>
            <button onclick="recomecarDoZero()">🔄 Recomeçar questões</button>
        </div>
    </div>

    <div id="simulado" style="display: none;">
        <div class="simulado-topo">
            <span id="simulado-contador">Questão 1 de 50</span>
            <span id="simulado-tempo">⏱ 2:30:00</span>
        </div>

        <div class="card quiz-container">
            <div id="simulado-contexto"></div>
            <div id="simulado-pergunta"></div>
        </div>

        <div class="simulado-navegacao">
            <button onclick="navegarProva(-1)">← Anterior</button>
            <button id="btnProxProva" class="btn-principal" onclick="navegarProva(1)">Próxima →</button>
        </div>

        <div class="finalizar-container">
            <button class="secundario" onclick="entregarProva()">Finalizar prova</button>
        </div>
    </div>

    <div id="resultado-simulado" class="card resultado" style="display: none;">

    <div class="resultado-cabecalho">
        <h2>Resultado</h2>
    </div>

    <div class="resultado-status">
        <p id="prova-status"></p>
    </div>

    <div class="resultado-indicadores">

        <div class="indicador">
            <span class="indicador-valor" id="prova-acertos">0/0</span>
            <span class="indicador-label">Acertos</span>
        </div>

        <div class="indicador">
            <span class="indicador-valor" id="prova-percentual">0%</span>
            <span class="indicador-label">Aproveitamento</span>
        </div>

        <div class="indicador">
            <span class="indicador-valor" id="prova-tempo"></span>
            <span class="indicador-label">Tempo utilizado</span>
        </div>

    </div>

    <div class="resultado-analise">
    <h3>Análise do desempenho</h3>
    <p id="texto-analise"></p>
</div>

    <div class="resultado-secao">
        <h3>Desempenho por módulo</h3>
        <div id="prova-modulos"></div>
    </div>

    <div class="resultado-secao">
        <h3>Detalhamento por tema</h3>
        <div id="prova-microtemas"></div>
    </div>

    <div class="resultado-botoes">
        <button onclick="sairDaProva()">🏠 Página inicial</button>
        <button class="btn-principal" onclick="iniciarProva()">🔄 Novo simulado</button>
    </div>

</div>
    </div>

    <div class="finalizar-container">
        <button id="btnFinalizar" class="secundario" onclick="finalizarSimulado()" style="display: none;">Finalizar</button>
    </div>

</main>

<script src="questoes.js"></script>
<script>

    let indiceAtual = 0;
    let pontuacao = 0;
    let questoesRespondidas = 0;
    let respondeuAtual = false;

    let usarCronometro = null;
    let tempoTotal = 0;
    let intervalo = null;
    let pausado = false;
    const QUESTOES_PROVA = 50;
    const TEMPO_PROVA = 150 * 60; // 2h30 em segundos
    const META_POR_QUESTAO = TEMPO_PROVA / QUESTOES_PROVA; // 180s = 3:00

    const todasQuestoes = [...questoes];
    let moduloEscolhido = "todos";

    /* ===== SORTEIO POR GRUPO ===== */
    function embaralhar(lista) {
        const copia = [...lista];
        for (let i = copia.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copia[i], copia[j]] = [copia[j], copia[i]];
        }
        return copia;
    }

    function sortearPorGrupo() {
        const selecionadas = moduloEscolhido === "todos"
            ? todasQuestoes
            : todasQuestoes.filter((q) => q.modulo === moduloEscolhido);

        const grupos = {};

        selecionadas.forEach((questao) => {
            if (!grupos[questao.grupo]) {
                grupos[questao.grupo] = [];
            }
            grupos[questao.grupo].push(questao);
        });

        const filas = embaralhar(Object.values(grupos)).map(embaralhar);
        const resultado = [];

        while (filas.some((fila) => fila.length > 0)) {
            filas.forEach((fila) => {
                if (fila.length > 0) {
                    resultado.push(fila.shift());
                }
            });
        }

        questoes.splice(0, questoes.length, ...resultado);
    }

    sortearPorGrupo();

    /* ===== NAVEGAÇÃO ===== */
    function iniciarSimulado() {
        document.getElementById("tela-inicial").style.display = "none";
        document.getElementById("escolha-modulo").style.display = "block";
    }

    function escolherModulo(modulo) {
        moduloEscolhido = modulo;

        indiceAtual = 0;
        pontuacao = 0;
        questoesRespondidas = 0;
        respondeuAtual = false;
        tempoTotal = 0;

        sortearPorGrupo();

        document.getElementById("escolha-modulo").style.display = "none";

        if (usarCronometro === null) {
            document.getElementById("escolha-cronometro").style.display = "block";
            return;
        }
        abrirQuiz();
    }

    function escolherCronometro(opcao) {
        usarCronometro = opcao;
        document.getElementById("escolha-cronometro").style.display = "none";
        abrirQuiz();
    }

    function abrirQuiz() {
        document.getElementById("tela-inicial").style.display = "none";
        document.getElementById("resultado").style.display = "none";
        document.getElementById("quiz").style.display = "flex";
        document.getElementById("btnFinalizar").style.display = "inline-block";

        if (usarCronometro) {
            pausado = false;
            document.getElementById("btnPausar").textContent = "⏸ Pausar";
            document.getElementById("cronometro").style.display = "block";
            iniciarCronometro();
        }

        continuarDeOndeParou();
    }

    function continuarDeOndeParou() {
        if (respondeuAtual) {
            indiceAtual++;
        }
        if (indiceAtual >= questoes.length) {
            indiceAtual = 0;
        }
        mostrarQuestao(indiceAtual);
    }

    function voltarQuestoes() {
        abrirQuiz();
    }

    function irParaInicio() {
        usarCronometro = null;

        indiceAtual = 0;
        pontuacao = 0;
        questoesRespondidas = 0;
        respondeuAtual = false;
        tempoTotal = 0;

        sortearPorGrupo();

        document.getElementById("resultado").style.display = "none";
        document.getElementById("tela-inicial").style.display = "block";
    }

    function recomecarDoZero() {
        if (!confirm("Isso vai zerar seu placar. Deseja recomeçar?")) {
            return;
        }

        indiceAtual = 0;
        pontuacao = 0;
        questoesRespondidas = 0;
        respondeuAtual = false;
        tempoTotal = 0;

        sortearPorGrupo();
        abrirQuiz();
    }

    /* ===== CRONÔMETRO ===== */
    function iniciarCronometro() {
        if (intervalo) {
            return;
        }
        atualizarCronometro();
        intervalo = setInterval(() => {
            tempoTotal++;
            atualizarCronometro();
        }, 1000);
    }

    function pararCronometro() {
        clearInterval(intervalo);
        intervalo = null;
    }

    function atualizarCronometro() {
        document.getElementById("tempo").textContent = `⏱ ${formatarTempo(tempoTotal)}`;
    }

    function alternarPausa() {
        const botao = document.getElementById("btnPausar");
        const quiz = document.getElementById("quiz");

        if (pausado) {
            pausado = false;
            iniciarCronometro();
            quiz.style.display = "flex";
            botao.textContent = "⏸ Pausar";
        } else {
            pausado = true;
            pararCronometro();
            quiz.style.display = "none";
            botao.textContent = "▶ Continuar";
        }
    }

    function formatarTempo(segundos) {
        const min = String(Math.floor(segundos / 60)).padStart(2, "0");
        const seg = String(segundos % 60).padStart(2, "0");
        return `${min}:${seg}`;
    }

    /* ===== QUESTÕES ===== */
    function mostrarQuestao(indice) {
        const questao = questoes[indice];
        const contextoDiv = document.getElementById("contexto-area");
        const perguntaDiv = document.getElementById("pergunta-area");

        respondeuAtual = false;

        if (questao.contexto) {
            contextoDiv.innerHTML = `<strong>Contexto</strong><p>${questao.contexto}</p>`;
            contextoDiv.style.display = "block";
        } else {
            contextoDiv.innerHTML = "";
            contextoDiv.style.display = "none";
        }

        const niveis = {
            "fácil": { texto: "Fácil", classe: "nivel-facil" },
            "médio": { texto: "Médio", classe: "nivel-medio" },
            "difícil": { texto: "Difícil", classe: "nivel-dificil" }
        };

        let html = "";

        if (niveis[questao.nivel]) {
            const nivel = niveis[questao.nivel];
            html += `<span class="nivel ${nivel.classe}">${nivel.texto}</span>`;
        }

        html += `<p>${questao.enunciado}</p>`;

        questao.alternativas.forEach((alternativa, i) => {
            html += `<button id="btn${i}" onclick="verificarResposta(${i})">${alternativa}</button><br>`;
        });

        perguntaDiv.innerHTML = html;
    }

    function verificarResposta(indiceEscolhido) {
        const questao = questoes[indiceAtual];
        const botaoClicado = document.getElementById(`btn${indiceEscolhido}`);
        const botaoCorreto = document.getElementById(`btn${questao.correta}`);

        questoesRespondidas++;
        respondeuAtual = true;

        if (indiceEscolhido === questao.correta) {
            botaoClicado.style.backgroundColor = "lightgreen";
            pontuacao++;
        } else {
            botaoClicado.style.backgroundColor = "salmon";
            botaoCorreto.style.backgroundColor = "lightgreen";
        }

        questao.alternativas.forEach((alternativa, i) => {
            document.getElementById(`btn${i}`).disabled = true;
        });

        const perguntaDiv = document.getElementById("pergunta-area");
        perguntaDiv.innerHTML += `<div class="proxima-container"><button onclick="proximaQuestao()">Próxima</button></div>`;
    }

    function proximaQuestao() {
        indiceAtual++;

        if (indiceAtual < questoes.length) {
            mostrarQuestao(indiceAtual);
        } else {
            finalizarSimulado();
        }
    }

    function finalizarSimulado() {
        pararCronometro();

        document.getElementById("quiz").style.display = "none";
        document.getElementById("cronometro").style.display = "none";
        document.getElementById("btnFinalizar").style.display = "none";

        document.getElementById("placar").textContent =
            `Você acertou ${pontuacao} de ${questoesRespondidas} questões.`;

        const mediaDiv = document.getElementById("media-tempo");
        const graficoDiv = document.getElementById("grafico-tempo");

        if (usarCronometro && questoesRespondidas > 0) {
            const media = Math.round(tempoTotal / questoesRespondidas);
            mediaDiv.textContent =
                `Tempo total: ${formatarTempo(tempoTotal)} | Sua média: ${formatarTempo(media)} | Meta: ${formatarTempo(META_POR_QUESTAO)}`;
            mediaDiv.style.display = "block";
            desenharGrafico(media);
            graficoDiv.style.display = "block";
        } else {
            mediaDiv.style.display = "none";
            graficoDiv.style.display = "none";
        }

        document.getElementById("resultado").style.display = "block";
    }

    function desenharGrafico(media) {
        const maximo = META_POR_QUESTAO * 2;
        const posicao = Math.min(media / maximo, 1) * 100;
        const previsao = media * QUESTOES_PROVA;

        let status;
        let classe;

        if (media <= META_POR_QUESTAO) {
            classe = "status-ok";
            status = `Dentro do tempo! Nesse ritmo, você terminaria a prova em ${formatarHoras(previsao)}.`;
        } else if (media <= META_POR_QUESTAO * 1.25) {
            classe = "status-atencao";
            status = `Atenção: um pouco acima da meta. Nesse ritmo, a prova levaria ${formatarHoras(previsao)}.`;
        } else {
            classe = "status-fora";
            status = `Acima do tempo. Nesse ritmo, a prova levaria ${formatarHoras(previsao)}, mais que as ${formatarHoras(TEMPO_PROVA)} disponíveis.`;
        }

        document.getElementById("grafico-tempo").innerHTML = `
            <div class="barra">
                <div class="zona zona-verde" style="width: 50%"></div>
                <div class="zona zona-amarela" style="width: 12.5%"></div>
                <div class="zona zona-vermelha" style="width: 37.5%"></div>
                <div class="marcador" style="left: ${posicao}%">
                    <span>Você</span>
                </div>
            </div>
            <div class="legenda">
                <span><i class="zona-verde"></i> Até ${formatarTempo(META_POR_QUESTAO)}</span>
                <span><i class="zona-amarela"></i> Atenção</span>
                <span><i class="zona-vermelha"></i> Acima do tempo</span>
            </div>
            <p class="${classe}">${status}</p>
        `;
    }

    function formatarHoras(segundos) {
    const h = Math.floor(segundos / 3600);
    const m = String(Math.floor((segundos % 3600) / 60)).padStart(2, "0");
    const s = String(segundos % 60).padStart(2, "0");

    return `${h}h${m}min${s}s`;
}

    /* ===== SIMULADO ===== */
    const DISTRIBUICAO_PROVA = {
        1: { "fácil": 3, "médio": 5, "difícil": 2 },
        2: { "fácil": 5, "médio": 10, "difícil": 5 },
        3: { "fácil": 3, "médio": 8, "difícil": 4 },
        4: { "fácil": 1, "médio": 3, "difícil": 1 }
    };
    const APROVACAO = 0.7;

    let prova = [];
    let respostasProva = [];
    let indiceProva = 0;
    let tempoRestante = 0;
    let intervaloProva = null;

    function montarProva() {
        const selecionadas = [];

        for (const modulo in DISTRIBUICAO_PROVA) {
            for (const nivel in DISTRIBUICAO_PROVA[modulo]) {
                const disponiveis = todasQuestoes.filter(
                    (q) => q.modulo === Number(modulo) && q.nivel === nivel
                );
                const quantidade = DISTRIBUICAO_PROVA[modulo][nivel];
                selecionadas.push(...embaralhar(disponiveis).slice(0, quantidade));
            }
        }

        return embaralhar(selecionadas);
    }

    function iniciarProva() {
        prova = montarProva();
        respostasProva = new Array(prova.length).fill(null);
        indiceProva = 0;
        tempoRestante = TEMPO_PROVA;

        document.getElementById("tela-inicial").style.display = "none";
        document.getElementById("resultado-simulado").style.display = "none";
        document.getElementById("simulado").style.display = "block";

        atualizarTempoProva();
        clearInterval(intervaloProva);
        intervaloProva = setInterval(() => {
            tempoRestante--;
            atualizarTempoProva();
            if (tempoRestante <= 0) {
                finalizarProva();
                alert("O tempo acabou! Sua prova foi entregue.");
            }
        }, 1000);

        mostrarQuestaoProva();
    }

    function atualizarTempoProva() {
        const h = Math.floor(tempoRestante / 3600);
        const m = String(Math.floor((tempoRestante % 3600) / 60)).padStart(2, "0");
        const s = String(tempoRestante % 60).padStart(2, "0");
        document.getElementById("simulado-tempo").textContent = `⏱ ${h}:${m}:${s}`;
    }

    function mostrarQuestaoProva() {
        const questao = prova[indiceProva];

        document.getElementById("simulado-contador").textContent =
            `Questão ${indiceProva + 1} de ${prova.length}`;

        const contextoDiv = document.getElementById("simulado-contexto");
        if (questao.contexto) {
            contextoDiv.innerHTML = `<strong>Contexto</strong><p>${questao.contexto}</p>`;
            contextoDiv.style.display = "block";
        } else {
            contextoDiv.innerHTML = "";
            contextoDiv.style.display = "none";
        }

        let html = `<p>${questao.enunciado}</p>`;
        questao.alternativas.forEach((alternativa, i) => {
            const classe = respostasProva[indiceProva] === i ? "marcada" : "";
            html += `<button class="${classe}" onclick="marcarResposta(${i})">${alternativa}</button>`;
        });
        document.getElementById("simulado-pergunta").innerHTML = html;

        document.getElementById("btnProxProva").textContent =
            indiceProva === prova.length - 1 ? "Entregar prova" : "Próxima →";
    }

    function marcarResposta(i) {
        respostasProva[indiceProva] = i;
        mostrarQuestaoProva();
    }

    function navegarProva(passo) {
        const novo = indiceProva + passo;

        if (novo < 0) {
            return;
        }
        if (novo >= prova.length) {
            entregarProva();
            return;
        }

        indiceProva = novo;
        mostrarQuestaoProva();
        window.scrollTo(0, 0);
    }

    function entregarProva() {
        const emBranco = respostasProva.filter((r) => r === null).length;
        const mensagem = emBranco > 0
            ? `Você deixou ${emBranco} questão(ões) em branco. Deseja entregar mesmo assim?`
            : "Deseja entregar a prova?";

        if (!confirm(mensagem)) {
            return;
        }
        finalizarProva();
    }

    function finalizarProva() {
        clearInterval(intervaloProva);
        intervaloProva = null;

        let acertos = 0;
        const porModulo = {};
        const porMicrotema = [];

        prova.forEach((questao, i) => {
            const acertou = respostasProva[i] === questao.correta;

            if (acertou) {
                acertos++;
            }

            if (!porModulo[questao.modulo]) {
                porModulo[questao.modulo] = { acertos: 0, total: 0 };
            }
            porModulo[questao.modulo].total++;
            if (acertou) {
                porModulo[questao.modulo].acertos++;
            }

            let micro = porMicrotema.find((m) => m.tema === questao.tema);
            if (!micro) {
                micro = { tema: questao.tema, acertos: 0, total: 0 };
                porMicrotema.push(micro);
            }
            micro.total++;
            if (acertou) {
                micro.acertos++;
            }
        });

        const percentual = Math.round((acertos / prova.length) * 100);
        const aprovado = acertos / prova.length >= APROVACAO;

        let textoAnalise = "";

    if (percentual >= 80) {
    textoAnalise =
        "Excelente desempenho! Você está demonstrando um bom domínio dos conteúdos.";
    } else if (percentual >= 70) {
    textoAnalise =
        "Bom desempenho. Você atingiu o percentual mínimo, mas alguns temas ainda podem ser revisados.";
    } else {
    textoAnalise =
        "Continue estudando. Revise principalmente os temas com menor percentual de acertos.";
    }

    document.getElementById("texto-analise").textContent = textoAnalise;

        document.getElementById("prova-acertos").textContent =
            `${acertos}/${prova.length}`;

        document.getElementById("prova-percentual").textContent =
            `${percentual}%`;

        const status = document.getElementById("prova-status");
        status.textContent = aprovado
            ? "✅ Aprovado! (mínimo de 70%)"
            : "❌ Reprovado. O mínimo é 70% (35 acertos)";
        status.className = aprovado ? "status-ok" : "status-fora";

        document.getElementById("prova-tempo").textContent =
            formatarHoras(TEMPO_PROVA - tempoRestante);

        let htmlModulos = "";

for (const modulo in porModulo) {
    const dados = porModulo[modulo];

    const nomeModulo =
        modulo == 1
            ? "Sistema Financeiro Nacional"
            : modulo == 2
            ? "Produtos do Mercado Financeiro"
            : modulo == 3
            ? "Relacionamento com o Cliente - Prospecção, Atendimento e Suporte"
            : modulo == 4
            ? "Inovação e Desenvolvimento de Mercado"
            : "Módulo " + modulo;

    htmlModulos += `
    <p class="resultado-modulo">
        <strong>${nomeModulo}</strong>
        <span>${dados.acertos} de ${dados.total} acertos</span>
    </p>
`;
}

document.getElementById("prova-modulos").innerHTML = htmlModulos;

        let htmlMicro = "";

porMicrotema.forEach((m) => {
    const percentualMicro = Math.round(
        (m.acertos / m.total) * 100
    );

    htmlMicro += `
        <div class="resultado-item">
            <div class="resultado-item-topo">
                <strong>${m.tema}</strong>
                <span>${m.acertos}/${m.total}</span>
            </div>

            <div class="barra-progresso">
                <div class="barra-progresso-preenchida"
                     style="width: ${percentualMicro}%">
                </div>
            </div>

            <div class="resultado-item-rodape">
                <span>${m.acertos} de ${m.total} acertos</span>
                <span>${percentualMicro}%</span>
            </div>
        </div>
    `;
});

        document.getElementById("prova-microtemas").innerHTML = htmlMicro;

        document.getElementById("simulado").style.display = "none";
        document.getElementById("resultado-simulado").style.display = "block";
    }

    function sairDaProva() {
        document.getElementById("resultado-simulado").style.display = "none";
        document.getElementById("tela-inicial").style.display = "block";
    }

</script>
